name: Check for Debug Statements

on:
  pull_request:
    branches: ["**"]

jobs:
  debug-check:
    name: Block debug statements (PHP & JS/TS, including test files)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Required: the gate computes merge-base(base, head) itself, so both
          # commits and their common ancestor must be present.  A shallow
          # checkout makes the gate refuse to run rather than pass by default.
          fetch-depth: 0

      - name: Detect debug statements added by this pull request
        run: |
          bash scripts/ci/check-added-debug-statements.sh \
            --profile check-debug-statements \
            --range "${{ github.event.pull_request.base.sha }}" \
                    "${{ github.event.pull_request.head.sha }}"
