# Incremental migration gate (G4.5)
#
# `migrate:fresh` proves migrations run against an EMPTY database. That is not
# the operation a deployment performs. A deployment applies *pending* migrations
# to a *populated* database already at the previous release's schema — and a
# migration can pass fresh while failing incrementally: an index name that
# already exists, a NOT NULL column added to a table that has rows, an
# `->after()` naming a column the older schema does not have.
#
# This job performs the real operation:
#
#   previous-release schema -> populated with representative rows
#                           -> this branch's migrations
#                           -> php artisan migrate --force
#                           -> assert zero pending, assert the rows survived
#
# WHY CHECK OUT THE MERGE BASE RATHER THAN COMMIT A SCHEMA DUMP
# ------------------------------------------------------------
# A committed dump of "the previous schema" is a second source of truth that has
# to be regenerated by hand whenever a migration lands. When somebody forgets,
# the gate silently keeps testing a schema nobody runs any more — a green check
# that proves nothing. The merge base is always accurate, needs no maintenance,
# and costs one `git checkout` of a single directory.

name: Incremental Migration Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  migrate-incremental:
    name: Migrate a populated previous-release schema to head
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: byo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: byo_test
      DB_USERNAME: root
      DB_PASSWORD: secret
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      TELESCOPE_ENABLED: false
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the merge base with main is reachable.
          fetch-depth: 0

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql, mbstring, xml, ctype, fileinfo, json, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment file
        run: cp .env.example .env && php artisan key:generate --force

      - name: Resolve the previous-release commit
        id: base
        run: |
          set -euo pipefail
          git fetch origin main --depth=200 || git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          echo "Previous-release commit: ${BASE}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Build the PREVIOUS release's schema
        run: |
          set -euo pipefail
          # Only the migrations directory moves. vendor/, .env and application
          # code stay at branch head, so this step answers exactly one question:
          # what did the schema look like before this branch?
          git checkout "${{ steps.base.outputs.base }}" -- database/migrations
          php artisan migrate --force --no-interaction

      - name: Populate representative rows
        run: php artisan migrate:incremental-fixture seed

      - name: Restore THIS branch's migrations
        run: git checkout HEAD -- database/migrations

      - name: Apply pending migrations incrementally
        run: php artisan migrate --force --no-interaction

      - name: Assert zero pending and the rows survived
        run: php artisan migrate:incremental-fixture verify
